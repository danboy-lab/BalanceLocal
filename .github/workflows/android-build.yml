name: Android CI - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
  GRADLE_HOME: ${{ runner.temp }}/gradle

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d cmdline
          mkdir -p cmdline-tools/latest
          mv cmdline/cmdline-tools/* cmdline-tools/latest/ || true
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.6 (fallback)
        run: |
          mkdir -p $GRADLE_HOME
          cd $GRADLE_HOME
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "Added gradle to ${GRADLE_HOME}"
        shell: bash

      - name: Add Gradle to PATH
        run: |
          echo "${{ runner.temp }}/gradle/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Make gradlew executable (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build Debug APK
        run: |
          set -e
          # Try wrapper first, fallback to downloaded Gradle if wrapper fails
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon -Pandroid.sdk.path=$ANDROID_SDK_ROOT || (
              echo "gradlew failed, falling back to downloaded gradle" && $GRADLE_HOME/gradle-8.6/bin/gradle assembleDebug --no-daemon -Pandroid.sdk.path=$ANDROID_SDK_ROOT
            )
          else
            $GRADLE_HOME/gradle-8.6/bin/gradle assembleDebug --no-daemon -Pandroid.sdk.path=$ANDROID_SDK_ROOT
          fi
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Release APK (unsigned)
        run: |
          set -e
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon -Pandroid.sdk.path=$ANDROID_SDK_ROOT || (
              echo "gradlew failed, falling back to downloaded gradle" && $GRADLE_HOME/gradle-8.6/bin/gradle assembleRelease --no-daemon -Pandroid.sdk.path=$ANDROID_SDK_ROOT
            )
          else
            $GRADLE_HOME/gradle-8.6/bin/gradle assembleRelease --no-daemon -Pandroid.sdk.path=$ANDROID_SDK_ROOT
          fi
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
